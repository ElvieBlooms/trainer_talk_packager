# Builds the Trainer Talk Packager for Linux, Windows and macOS and attaches
# the installers to a draft GitHub release.
#
# Each platform builds on its own runner, because the app ships native
# parts (onnxruntime-node, sharp, node-llama-cpp) that npm only installs for
# the platform it runs on. Run it by pushing a tag like v0.11.2, or by hand
# from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # electron-builder downloads Electron and its packaging tools from GitHub
      # and sometimes gets a 504 back. Try the build up to six times, and
      # cache what it managed to download even when a build fails, so the
      # next attempt or run starts further along.
      - uses: actions/cache/restore@v4
        id: ebcache
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-
      - name: Build installer
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            npm run ${{ matrix.script }} -- --publish never && exit 0
            echo "Build attempt $attempt failed."
            sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/cache/save@v4
        if: always() && steps.ebcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: packager-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  # Only a tag makes a release. A manual run just leaves the installers as
  # downloadable build artifacts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
